# Optional telemetry services use the metrics profile; include only modularizes them.
include:
  - ./telemetry/compose.yaml

services:
  web:
    container_name: web
    pull_policy: build
    build:
      context: ./apps/web
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.4.2}
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_HOST_ADDR:-0.0.0.0}:${WEB_HOST_PORT:-3000}:${WEB_PORT:-3000}"
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-3000}
      # The default derives the gateway listener port from its owner. Override
      # this URL to use any other Responses-compatible service.
      INFERENCE_ENDPOINT: ${WEB_INFERENCE_ENDPOINT:-http://api:${API_PORT}/v1}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-}
      INFERENCE_API_KEY: ${WEB_INFERENCE_API_KEY:-}
      # Optional overrides from .env; the web app owns generation defaults.
      INFERENCE_TEMPERATURE:
      INFERENCE_MAX_OUTPUT_TOKENS:
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:' + process.env.WEB_PORT + '/healthz'); process.exit(response.ok ? 0 : 1);"

  api:
    # Rebuild changed source on plain `docker compose up`; unchanged layers stay cached.
    pull_policy: build
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.98-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/cc-debian13:nonroot}
    init: true
    restart: unless-stopped
    ports:
      - "${API_ADDRESS}:${API_HOST_PORT}:${API_PORT}"
    environment:
      API_ADDRESS: ${API_ADDRESS:?Set API_ADDRESS in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      INFERENCE_ENDPOINT: ${INFERENCE_ENDPOINT:?Set INFERENCE_ENDPOINT in .env}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-300}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-5}
    depends_on:
      local-model:
        condition: service_started
        required: false

  # Only local deployments should download and configure model weights.
  local-model:
    profiles: [local]
    provider:
      type: model
      options:
        model: ${INFERENCE_MODEL:-}
