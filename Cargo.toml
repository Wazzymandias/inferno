[package]
name = "infergate"
version = "0.0.1"
edition = "2024"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"
private_bounds = "deny"
private_interfaces = "deny"

[lints.rustdoc]
all = "warn"

[lints.clippy]
# Baseline - enable all default Clippy lints.
all = { level = "warn", priority = -1 }

# Performance and cloning.
missing_const_for_fn = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
flat_map_option = "deny"
implicit_clone = "deny"
or_fun_call = "warn"

# Code style.
manual_let_else = "deny"
wildcard_imports = "warn"
use_self = "warn"
option_if_let_else = "deny"
uninlined_format_args = "deny"
manual_string_new = "warn"
single_char_pattern = "warn"
redundant_else = "deny"
match_same_arms = "deny"

# Safety and documentation.
undocumented_unsafe_blocks = "deny"
doc_markdown = "deny"

# Debugging artifacts.
dbg_macro = "warn"

# Code quality.
bind_instead_of_map = "deny"
borrowed_box = "deny"
branches_sharing_code = "deny"
clone_on_copy = "deny"
derive_partial_eq_without_eq = "warn"
explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
iter_with_drain = "deny"
needless_pass_by_ref_mut = "deny"
string_lit_as_bytes = "deny"
too_many_lines = "deny"
try_err = "deny"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bpaf = { version = "0.9.27", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls-graviola = { version = "0.4.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
webpki-root-certs = { version = "1.0.9", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }

[profile.release]
strip = true
