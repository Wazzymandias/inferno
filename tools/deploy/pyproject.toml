[project]
name = "inferno-mlx"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = ["vllm==0.31.0+cpu", "vllm-metal==0.31.0"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

# Metal supplies GPU execution despite the core's +cpu suffix. Its development
# releases are deleted on each publish, so pin the matching source commit.
[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.31.0/vllm-0.31.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl" }
vllm-metal = { git = "https://github.com/vllm-project/vllm-metal", rev = "27cfcd8b6b6f4a3daf89ca7e30597517efa57a2d" }
