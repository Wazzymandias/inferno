[project]
name = "infergate-mlx"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = ["vllm==0.31.0+cpu", "vllm-metal==0.31.0.dev20261006214222"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

# Matching upstream core and Metal prerelease artifacts, pinned to immutable
# release tags. Metal supplies GPU execution despite the core's +cpu suffix.
[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.31.0/vllm-0.31.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl" }
vllm-metal = { url = "https://github.com/vllm-project/vllm-metal/releases/download/v0.31.0.dev20261006214222/vllm_metal-0.31.0.dev20261006214222-cp312-cp312-macosx_15_0_arm64.whl" }
